<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del alojamiento · Marketplace de Alojamientos</title>
  <link rel="stylesheet" href="../../css/reservas.css">
  <link rel="stylesheet" href="../../css/alojamientos.css">
</head>
<body>
  <header class="barra" id="barra" data-actual="detalle"></header>
  <main>
    <p><a href="buscar.html">← Volver a la búsqueda</a></p>
    <div id="mensaje" role="status" aria-live="polite"></div>
    <article id="detalle" class="oculto">
      <h1 id="titulo"></h1>
      <p class="suave" id="subtitulo"></p>
      <div class="galeria" id="galeria"></div>
      <section class="card">
        <h2>Descripción</h2>
        <p id="descripcion"></p>
        <p><strong>Dirección:</strong> <span id="direccion"></span></p>
        <p><strong>Capacidad:</strong> <span id="capacidad"></span></p>
        <h2 style="margin-top:16px">Servicios</h2>
        <ul class="chips" id="servicios"></ul>
        <h2 style="margin-top:16px">Reglas</h2>
        <p id="reglas"></p>
      </section>
      <section class="card">
        <h2>Precio</h2>
        <table class="desglose" id="precios"></table>
        <p class="aviso info" id="politica"></p>
        <div class="acciones">
          <a class="boton" id="cotizar">Cotizar y reservar</a>
          <a class="boton secundario" id="calendario" style="background:transparent;color:var(--primario);border:1px solid var(--primario)">Ver disponibilidad</a>
        </div>
      </section>
      <section class="card">
        <h2>Reseñas</h2>
        <p id="calificacion"></p>
      </section>
    </article>
  </main>
  <script src="../../js/config.js"></script>
  <script src="../../js/alojamientos/api.js"></script>
  <script src="../../js/alojamientos/detalle.js"></script>
</body>
</html>
