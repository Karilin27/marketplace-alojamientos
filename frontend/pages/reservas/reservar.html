<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar alojamiento · Marketplace de Alojamientos</title>
  <link rel="stylesheet" href="../../css/reservas.css">
</head>
<body>
  <header class="barra" id="barra" data-actual="reservar"></header>
  <main>
    <h1>Reservar alojamiento</h1>
    <div id="mensaje" role="status" aria-live="polite"></div>
    <form id="form" class="card" novalidate>
      <h2>1. Fechas y huéspedes</h2>
      <div class="fila">
        <div><label for="llegada">Llegada</label><input type="date" id="llegada" required><p class="error-campo" id="e-llegada"></p></div>
        <div><label for="salida">Salida</label><input type="date" id="salida" required><p class="error-campo" id="e-salida"></p></div>
        <div><label for="huespedes">Huéspedes</label><input type="number" id="huespedes" min="1" value="1" required><p class="error-campo" id="e-huespedes"></p></div>
      </div>
      <fieldset id="servicios" class="oculto" style="border:0;padding:0;margin:12px 0 0"><legend style="font-weight:600">Servicios adicionales</legend></fieldset>
      <div class="acciones"><button type="submit" id="btn-cotizar">Ver cotización</button></div>
    </form>
    <section id="cotizacion" class="card oculto" aria-labelledby="t-cot">
      <h2 id="t-cot">2. Cotización</h2>
      <table class="desglose" id="desglose"></table>
      <p class="suave" id="vigencia"></p>
      <p id="politica" class="aviso info"></p>
      <div class="acciones"><button id="btn-reservar" type="button">Reservar y pagar</button></div>
    </section>
  </main>
  <script src="../../js/reservas/config.js"></script>
  <script src="../../js/reservas/logica.js"></script>
  <script src="../../js/reservas/api.js"></script>
  <script src="../../js/reservas/nav.js"></script>
  <script src="../../js/reservas/reservar.js"></script>
</body>
</html>
